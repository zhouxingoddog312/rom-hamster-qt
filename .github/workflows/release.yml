name: Release

# 打 v* 标签时在四个平台打包并发布 GitHub Release（ARCHITECTURE.md §9.1）。
#   Linux  : CLI deb + CLI tarball，GUI deb + AppImage
#   Windows: CLI zip，GUI zip + Inno Setup 安装包
# 全部产物汇总成 SHA256SUMS 后一起上传；不做签名。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-cli:
    name: linux-cli packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config util-linux \
            debhelper dpkg-dev fakeroot gettext \
            libglib2.0-dev libsqlite3-dev libarchive-dev libxml2-dev zlib1g-dev \
            libcurl4-openssl-dev
      - name: Configure
        run: >
          cmake -S . -B build/linux-cli -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRH_GUI=OFF
      - name: Build
        run: cmake --build build/linux-cli --parallel
      - name: Test
        run: ctest --test-dir build/linux-cli --output-on-failure
      - name: Package deb
        run: sh packaging/make-deb.sh
      - name: Package tarball
        run: sh packaging/make-tarball.sh
      - name: Check glibc baseline
        run: sh packaging/check-glibc.sh --max 2.35 build/linux-cli/rom-hamster
      - uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  linux-gui:
    name: linux-gui packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config util-linux binutils \
            dpkg-dev fakeroot libfuse2 patchelf file \
            libglib2.0-dev libsqlite3-dev libarchive-dev libxml2-dev zlib1g-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - name: Configure
        run: >
          cmake -S . -B build/linux-gui -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRH_GUI=ON
      - name: Build
        run: cmake --build build/linux-gui --parallel
      - name: Test
        run: ctest --test-dir build/linux-gui --output-on-failure
      - name: Package deb
        run: |
          # 前置快照写在工作流 shell 里：即使脚本被杀死，这里也能存活保留现场。
          {
            echo "=== PRE free -m ==="; free -m
            echo "=== PRE df -h ==="; df -h / /tmp
            echo "=== PRE cmake ==="; cmake --version | head -1
          } > /tmp/pre-debug.txt 2>&1
          # 直接重定向到文件（不走管道），确保 $? 是脚本真实退出码：
          # 被信号杀死时为 128+N（SIGKILL=137 / SIGTERM=143），正常失败为 1。
          bash packaging/make-gui-deb.sh > /tmp/make-gui-deb.log 2>&1
          rc=$?
          echo "script_rc=$rc"
          if [ "$rc" -ne 0 ]; then
            {
              echo "make-gui-deb.sh FAILED (rc=$rc) — full log in artifact linux-gui-debug-log"
              echo "=== SCRIPT LOG (last 40, numbered) ==="; nl -ba /tmp/make-gui-deb.log | tail -n 40
              echo "=== dmesg tail -10 (look for OOM 'Killed process') ==="; dmesg 2>/dev/null | tail -10 || echo "(dmesg unavailable)"
              echo "=== POST free -m ==="; free -m
              echo "=== /proc/meminfo (head 8) ==="; head -8 /proc/meminfo
              echo "=== PRE DEBUG ==="; cat /tmp/pre-debug.txt
            } > /tmp/fail-debug.txt 2>&1
            # 每个 check run 最多 50 条注解；把最关键的（脚本日志尾部，含 xtrace
            # 死亡点）放在最前面，超出部分见上传的完整日志 artifact。
            sed -e 's/%/%25/g' -e 's/:/%3A/g' /tmp/fail-debug.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit "$rc"
          fi
      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gui-debug-log
          path: |
            /tmp/make-gui-deb.log
            /tmp/pre-debug.txt
            /tmp/fail-debug.txt
          if-no-files-found: ignore
      - name: Download AppImage tools
        run: |
          mkdir -p tools
          base=https://github.com
          curl -fsSL --retry 3 -o tools/linuxdeploy "$base/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSL --retry 3 -o tools/linuxdeploy-plugin-qt "$base/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          curl -fsSL --retry 3 -o tools/appimagetool "$base/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          curl -fsSL --retry 3 -o tools/runtime-x86_64 "$base/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64"
          chmod +x tools/linuxdeploy tools/linuxdeploy-plugin-qt tools/appimagetool
      - name: Package AppImage
        env:
          RH_LINUXDEPLOY: ${{ github.workspace }}/tools/linuxdeploy
          RH_LINUXDEPLOY_QT: ${{ github.workspace }}/tools/linuxdeploy-plugin-qt
          RH_APPIMAGETOOL: ${{ github.workspace }}/tools/appimagetool
          RH_APPIMAGE_RUNTIME: ${{ github.workspace }}/tools/runtime-x86_64
        run: bash packaging/make-appimage.sh
      - name: Check glibc baseline
        run: >
          sh packaging/check-glibc.sh --max 2.35
          build/linux-gui/rom-hamster build/linux-gui/rom-hamster-gui
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gui
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  windows-cli:
    name: windows-cli zip
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-curl
      - name: Locate toolchain
        run: echo "MSYS2_MINGW_BIN=$(cygpath -w /mingw64/bin)" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -S . -B build/windows-cli -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRH_GUI=OFF
      - name: Build
        run: cmake --build build/windows-cli --parallel
      - name: Test
        run: ctest --test-dir build/windows-cli --output-on-failure
      - name: Package zip
        shell: pwsh
        run: |
          $env:PATH = "$env:MSYS2_MINGW_BIN;$env:PATH"
          ./packaging/windows/package-zip.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-cli
          path: dist/*.zip
          if-no-files-found: error

  windows-gui:
    name: windows-gui zip + setup
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
      - name: Locate toolchain
        run: echo "MSYS2_MINGW_BIN=$(cygpath -w /mingw64/bin)" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -S . -B build/windows-gui -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRH_GUI=ON
      - name: Build
        run: cmake --build build/windows-gui --parallel
      - name: Test
        run: ctest --test-dir build/windows-gui --output-on-failure
      - name: Package zip
        shell: pwsh
        run: |
          $env:PATH = "$env:MSYS2_MINGW_BIN;$env:PATH"
          ./packaging/windows/package-zip.ps1 -Gui
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Package setup
        shell: pwsh
        run: ./packaging/windows/make-setup.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-gui
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  release:
    name: publish release
    needs: [linux-cli, linux-gui, windows-cli, windows-gui]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n '/^project(/,/^)/p' CMakeLists.txt |
            sed -n 's/^ *VERSION *\([0-9][0-9.]*\).*/\1/p')
          echo "project=$version tag=$GITHUB_REF_NAME"
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "标签与 CMakeLists.txt 的版本号不一致" >&2
            exit 1
          }
      - name: Checksums
        run: sh packaging/make-checksums.sh
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
