; Pegasus 前端规格（metadata.pegasus.txt）
; 记录以空行收尾；资产键为全小写 assets.titlescreen（Pegasus Assets.h）。

[frontend]
id           = pegasus
name         = Pegasus
spec_version = 1
escape       = text
layout_rom   = %platform%/%rom_file%
manifest     = %platform%/metadata.pegasus.txt
media_dir    = %platform%/media

[export.header]
[export.game]
game: %name%
file: ./%rom_file%
%if:description%description: %description_line%
%endif%%if:developer%developer: %developer%
%endif%%if:publisher%publisher: %publisher%
%endif%%if:genre%genre: %genre%
%endif%%if:year%release: %year%
%endif%%if:players%players: %players%
%endif%%if:rating_norm%rating: %rating_norm%
%endif%%if:cover_rel%assets.boxFront: ./%cover_rel%
%endif%%if:screenshot_rel%assets.screenshot: ./%screenshot_rel%
%endif%%if:marquee_rel%assets.titlescreen: ./%marquee_rel%
%endif%%if:video_rel%assets.video: ./%video_rel%%endif%

[export.footer]

[export.media]
covers      = %media_dir%/covers/%game_name%
screenshots = %media_dir%/screenshots/%game_name%
videos      = %media_dir%/videos/%game_name%
marquees    = %media_dir%/marquees/%game_name%

[import]
file           = %platform%/metadata.pegasus.txt
format         = lines
record         = game:
field.name     = name
field.description = description
field.rom      = file
