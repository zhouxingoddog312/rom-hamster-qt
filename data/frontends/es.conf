; EmulationStation（上游 / RetroPie）前端规格
; 与 ES-DE 的差别：上游 gamelist.xml 读取 <image>/<marquee>/<video> 标签，
; 因此本模板输出媒体标签；ES-DE 的模板不输出（见 esde.conf）。

[frontend]
id           = es
name         = EmulationStation
spec_version = 1
escape       = xml
layout_rom   = %platform%/%rom_file%
manifest     = %platform%/gamelist.xml
media_dir    = %platform%/media

[export.header]
<?xml version="1.0"?>
<gameList>

[export.game]
  <game>
    <path>./%rom_file:xml%</path>
    <name>%name:xml%</name>
%if:description%    <desc>%description:xml%</desc>
%endif%%if:rating_norm%    <rating>%rating_norm%</rating>
%endif%%if:releasedate_es%    <releasedate>%releasedate_es%</releasedate>
%endif%%if:developer%    <developer>%developer:xml%</developer>
%endif%%if:publisher%    <publisher>%publisher:xml%</publisher>
%endif%%if:genre%    <genre>%genre:xml%</genre>
%endif%%if:players%    <players>%players%</players>
%endif%%if:cover_rel%    <image>./%cover_rel:xml%</image>
%endif%%if:marquee_rel%    <marquee>./%marquee_rel:xml%</marquee>
%endif%%if:video_rel%    <video>./%video_rel:xml%</video>
%endif%
  </game>

[export.footer]
</gameList>

[export.media]
covers    = %media_dir%/covers/%game_name%
marquees  = %media_dir%/marquees/%game_name%
videos    = %media_dir%/videos/%game_name%

[import]
file           = %platform%/gamelist.xml
format         = xml
record         = /gameList/game
field.name     = ./name
field.description = ./desc
field.cover    = ./image
field.marquee  = ./marquee
field.video    = ./video
field.rom      = ./path
