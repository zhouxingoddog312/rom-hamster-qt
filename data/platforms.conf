# ---------------------------------------------------------------------------
# 街机 ZIP 内的成员后缀：哈希匹配时逐个成员计算，不当作独立 ROM。
# ---------------------------------------------------------------------------
[arcade_rom_suffixes]
.rom;.bin;.chr;.prg;.snd;.vram;.m68k;.z80;.gfx

# ---------------------------------------------------------------------------
# 媒体目录名（导入时按此识别，导出时按此写回）
# ---------------------------------------------------------------------------
[media_type_dirs]
rom=rom
covers=covers
screenshots=screenshots
videos=videos
marquees=marquees
miximages=miximages
intro=intro
patcher=patcher

# ---------------------------------------------------------------------------
# 媒体后缀：按类型限定，避免把 .mp4 当封面、把 .png 当视频
# ---------------------------------------------------------------------------
[media_suffix_rules]
covers=.jpg;.jpeg;.png;.webp
screenshots=.jpg;.jpeg;.png;.webp
videos=.mp4;.webm;.mkv;.avi
marquees=.png;.jpg;.jpeg;.webp
miximages=.png;.jpg;.jpeg;.webp
intro=.txt;.md
patcher_generic=.ips;.bps;.ups;.ppf;.xdelta;.xdelta3;.patch;.ips32

# ---------------------------------------------------------------------------
# 归档后缀：单独识别，不混进任何平台行
# ---------------------------------------------------------------------------
[archive_extensions]
.zip;.rar;.7z
