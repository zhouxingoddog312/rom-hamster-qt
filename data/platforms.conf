# =============================================================================
# rom-hamster 平台规则库（出厂默认，只读）
# =============================================================================
# 安装位置：
#   Linux   /usr/share/rom-hamster/platforms.conf（由 rom-hamster-data 包提供）
#   Windows <安装目录>/share/rom-hamster/platforms.conf
# 覆盖顺序（详见 §10.2）：
#   内置默认 → 安装目录 → 系统配置 → 用户配置
#   Linux    /usr/share → /etc/rom-hamster → ~/.config/rom-hamster
#   Windows  <安装目录> → %ProgramData%\rom-hamster → %APPDATA%\rom-hamster
#
# 数据来源与复核政策：
#   扩展名清单按以下一手资料核对，再剔除"为容错而列"的部分：
#     1. ES-DE 的系统定义 resources/systems/unix/es_systems.xml（每个系统的扩展名集合）
#     2. Pegasus 官方仓库的元数据样例与解析器
#     3. EmulationStation（RetroPie）与 ES-DE 的 gamelist.xml 字段声明
#
#   ES-DE 的清单是超集：它把归档格式（.zip/.7z）、播放列表（.m3u）以及跨平台
#   容错扩展（例如给 gb 也列出 .sfc/.smc）都算进系统扩展。本库不照搬：
#     - 归档由 [archive_extensions] 单独识别，混进平台会让压缩包分流与平台判定
#       互相污染；
#     - 跨平台容错扩展会让二义判定失效（一个 .bin 命中十几个平台，确认弹窗淹没用户）。
#   因此只保留该平台真实存在的映像格式，以及有实物证据的同族变体。被刻意剔除
#   的项在对应分组下注明，便于日后复核。
#
# 格式（v1）：
#   [platform_extensions] 每个平台一行：
#     平台ID:后缀;后缀;…;key=value;key=value;…
#   未知键必须被忽略（新增属性不改解析器）；未知段同样忽略。
#   平台ID 为内部规范名：小写字母、数字、连字符。
#
# 字段：
#   后缀列表            ROM 映像后缀，分号分隔，一律带点
#   compress_supported  该平台 ROM 能否压缩后直读（卡带类 true，光盘类 false）
#   recommended_format  推荐存储格式：zip/7z/chd/cso/wbfs/raw
#   arcade              街机基板：true 时 ZIP 直存、按多文件哈希匹配
#   patch_formats       该平台专属补丁/DLC 后缀
#   ambiguous_formats   二义后缀（可能本体也可能补丁），导入时确认
#   aliases             目录名别名，逗号分隔；整库导入时反查平台 ID
# =============================================================================

[meta]
spec_version=1

[platform_extensions]

