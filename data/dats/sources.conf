# =============================================================================
# rom-hamster DAT 源清单（出厂默认，spec_version = 1）
# =============================================================================
# 安装位置：
#   Linux   /usr/share/rom-hamster/dats/sources.conf
#   Windows <安装目录>/share/rom-hamster/dats/sources.conf
#
# 查找与覆盖顺序（先找到先用）：
#   1. 环境变量 ROM_HAMSTER_DAT_SOURCES 指定的文件
#   2. 用户配置 ~/.config/rom-hamster/dats/sources.conf
#      Windows %APPDATA%\rom-hamster\dats\sources.conf
#   3. 安装目录的 dats/sources.conf（本文件）
#   CLI 也可用 `rom-hamster dat sources --file PATH` 直接指定。
#
# 格式：
#   [meta]
#   spec_version=1
#
#   [平台ID]
#   name=展示名（可选，缺省取文件名去掉 .dat）
#   file=本地文件名（必填，不能带路径）
#   url=下载地址（至少一条，可重复；按书写顺序尝试）
#   sha1=文件 SHA1（可选，40 位十六进制）
#
#   平台 ID 必须与 data/platforms.conf 的规范 ID 一致；大小写敏感（小写）。
#   未知键、未知段内容会被忽略，便于后续扩展。
#
# 下载源：
#   raw.githubusercontent.com 为上游原始地址；ghfast.top 为国内加速镜像。
#   镜像只是前缀代理，路径与上游完全一致。
#
# 未收录的 libretro-database DAT（无法一一对应现有平台 ID，用户可自行追加）：
#   Arduboy Inc - Arduboy.dat        Cannonball.dat
#   Cave Story.dat                   ChaiLove.dat
#   DICE.dat                         Dinothawr.dat
#   DOS.dat                          Enterprise - 128.dat
#   Flashback.dat                    HBMAME.dat
#   Handheld Electronic Game.dat     Jump 'n Bump.dat
#   LowRes NX.dat                    Lutro.dat
#   MicroW8.dat                      MrBoom.dat
#   PuzzleScript.dat                 Quake.dat / Quake II.dat / Quake III.dat
#   Rick Dangerous.dat               RPG Maker.dat
#   Sony - PlayStation Minis.dat     System.dat
#   Tomb Raider.dat                  Videoton - TV-Computer.dat
#   Vircon32.dat                     Wolfenstein 3D.dat
#   ps1.idlst（不是 DAT）
# =============================================================================

[meta]
spec_version=1

